name: Deploy to AWS

on:
  push:
    branches: [main]

permissions:
  id-token: write   # required for OIDC role assumption
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::963439717919:role/urlchecker-github-deploy
          aws-region: ap-southeast-2

      - name: Deploy via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0d3b8e61062dedab9" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["cd /opt/urlchecker/app && git pull && docker compose -f docker-compose.aws.yml up -d --build"]' \
            --query "Command.CommandId" --output text)

          echo "Waiting for command $COMMAND_ID..."
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0d3b8e61062dedab9"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0d3b8e61062dedab9"
