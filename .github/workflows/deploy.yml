name: Deploy to AWS

on:
  push:
    branches: [main]

permissions:
  id-token: write   # required for OIDC role assumption
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::963439717919:role/urlchecker-github-deploy
          aws-region: ap-southeast-2

      - name: Ensure instance is running
        run: |
          set -e
          INSTANCE_ID="i-0d3b8e61062dedab9"

          # The worker's auto-stop-after-idle Cloudflare Worker (out of scope
          # here, see worker/ — untracked) can leave this instance stopped
          # between deploys. Treat "instance is stopped" as a normal,
          # recurring condition rather than a hard failure.
          STATE=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].State.Name" --output text)
          echo "Current instance state: $STATE"

          if [ "$STATE" = "stopping" ]; then
            echo "Instance is stopping, waiting for it to fully stop first..."
            aws ec2 wait instance-stopped --instance-ids "$INSTANCE_ID"
            STATE="stopped"
          fi

          if [ "$STATE" = "stopped" ]; then
            echo "Instance was stopped, starting it..."
            aws ec2 start-instances --instance-ids "$INSTANCE_ID"

            echo "Waiting for instance to reach 'running' state..."
            aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"
            echo "Instance is running."

            echo "Waiting for SSM agent to report Online (up to 2 minutes)..."
            PING_STATUS="Unknown"
            for i in $(seq 1 24); do
              PING_STATUS=$(aws ssm describe-instance-information \
                --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
                --query "InstanceInformationList[0].PingStatus" --output text)
              echo "[$i] SSM ping status: $PING_STATUS"
              if [ "$PING_STATUS" = "Online" ]; then
                break
              fi
              sleep 5
            done

            if [ "$PING_STATUS" != "Online" ]; then
              echo "::error::SSM agent did not report Online within 2 minutes of instance start"
              exit 1
            fi
          else
            echo "Instance already running, proceeding."
          fi

      - name: Deploy via SSM
        run: |
          INSTANCE_ID="i-0d3b8e61062dedab9"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["cd /opt/urlchecker/app && git pull && docker compose -f docker-compose.aws.yml up -d --build"]' \
            --query "Command.CommandId" --output text)

          # aws ssm wait command-executed gives up after a fixed ~100s, which
          # is shorter than a full `docker compose build` on this instance's
          # 1GB RAM (the React production build alone can take 2+ minutes).
          # Poll manually instead, with enough headroom for that.
          echo "Waiting for command $COMMAND_ID (up to 10 minutes)..."
          STATUS="InProgress"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" --output text)
            echo "[$i] status: $STATUS"
            case "$STATUS" in
              Pending|InProgress|Delayed) sleep 10 ;;
              *) break ;;
            esac
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}"

          if [ "$STATUS" != "Success" ]; then
            echo "::error::Deploy command finished with status $STATUS"
            exit 1
          fi
